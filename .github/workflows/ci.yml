name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: python -m pip install -e ".[dev]"
      - name: offline import smoke (zero import-time egress)
        run: python -c "import thinwrap.llm; print('import ok')"
      - name: test + coverage gate (>=80%)
        run: pytest --cov=thinwrap.llm --cov-report=term-missing --cov-fail-under=80
