[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thinwrap-llm"
version = "1.0.0"
description = "Lightweight, SDK-free, zero-dependency Python wrapper for chat completions (with streaming) and embeddings across 18 LLM providers behind one normalized surface."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dmitry Polyanovsky" }]
keywords = ["llm", "ai", "chat", "embeddings", "openai", "anthropic", "bedrock", "gemini", "streaming"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]

[project.urls]
Homepage = "https://thinwrap.dev"
Repository = "https://github.com/thinwrap/llm-py"

[tool.setuptools.packages.find]
where = ["src"]
include = ["thinwrap.llm*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
